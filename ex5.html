<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <p>Exemplo usando For</p>
    <script>
        for(var i = 1; i <= 5; i++){
            console.log("Número: " + i);
            document.write("<p>Número: " + i + "</p>");
        }
    </script>
</body>
