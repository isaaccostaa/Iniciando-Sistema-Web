<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>Cadastro de Telefone simples (nome  e telefone) e armazenar na sessionstorange</p>
    <form>
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required><br><br>

        <label for="telefone">Telefone:</label>
        <input type="text" id="telefone" name="telefone" required><br><br>

        <button type="submit" onclick="cadastrar()">Cadastrar</button>
    </form>
    <script>
        const form = document.getElementById('telefoneForm');
        form.addEventListener("submit", function(event){
            event.preventDefault();
            const nome = document.getElementById('nome').value;
            const telefone = document.getElementById('telefone').value;
            const cadastro = { nome, telefone};
            sessionStorage.setItem('cadastro', JSON.stringify(cadastro));
            console.log("Cadastro realizado:", cadastro);
        });
    </script>
</body>
</html>
